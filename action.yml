name: 'ProofCore Release Notary'
description: 'Cryptographically seals GitHub Releases and binary checksums on the TON Blockchain via ProofCore.'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  github_token:
    description: 'GITHUB_TOKEN to read and update the release.'
    required: true
runs:
  using: "composite"
  steps:
    - name: Seal Release and Append Badge
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        echo "🛡️ Extracting Git metadata for $TAG..."
        BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
        COMMIT_SHA=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish -q .targetCommitish)
        
        echo "📦 Downloading release assets to compute checksums locally on runner..."
        mkdir -p /tmp/proofcore_assets
        # Скачиваем файлы релиза во временную папку раннера GitHub
        gh release download "$TAG" --repo "$REPO" --dir /tmp/proofcore_assets || true
        
        # Считаем SHA-256 каждого бинарника
        CHECKSUMS=$(cd /tmp/proofcore_assets && sha256sum * 2>/dev/null || echo "No binary assets uploaded")
        rm -rf /tmp/proofcore_assets
        
        # Формируем легкий текстовый манифест (2 КБ)
        MANIFEST="Repository: $REPO
        Release Tag: $TAG
        Target Commit: $COMMIT_SHA

        Artifact SHA-256 Checksums:
        $CHECKSUMS

        Release Notes:
        $BODY"
        
        echo "🚀 Sealing Manifest via ProofCore API..."
        PAYLOAD=$(jq -n --arg content "$MANIFEST" --arg agent "github-release-notary" --arg title "Release $TAG ($REPO)" '{content: $content, agent_id: $agent, title: $title}')
        
        RESPONSE=$(curl -s -X POST https://api.proofcore.org/api/v0.1/seal -H "Content-Type: application/json" -d "$PAYLOAD")
        BADGE=$(echo "$RESPONSE" | jq -r .badge_markdown)
        
        if [ "$BADGE" == "null" ] || [ -z "$BADGE" ]; then
          echo "❌ Failed to seal release. Response: $RESPONSE"
          exit 1
        fi
        
        NEW_BODY="$BODY

        ---
        $BADGE"
        
        echo "📝 Updating GitHub Release with Verification Badge..."
        gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
        echo "🎉 Done! Manifest permanently anchored on TON."
