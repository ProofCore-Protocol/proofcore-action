name: 'ProofCore Release Notary'
description: 'Cryptographically seals GitHub Releases and binary checksums on the TON Blockchain via ProofCore.'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  github_token:
    description: 'GITHUB_TOKEN to read and update the release.'
    required: true
runs:
  using: "composite"
  steps:
    - name: Seal Release and Append Badge
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        echo "🛡️ [1/4] Extracting Release metadata for $TAG..."
        RAW_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
        COMMIT_SHA=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish -q .targetCommitish)
        
        # Очищаем старые бейджи ProofCore из текста релиза (на случай повторного запуска)
        CLEAN_BODY=$(echo "$RAW_BODY" | sed -E 's/---\s*\[!\[ProofCore\].*//g' | sed -E 's/\[!\[ProofCore\].*//g' | sed -E 's/---\s*<a href="https:\/\/proofcore\.org.*<\/a>//g' | sed -E 's/<a href="https:\/\/proofcore\.org.*<\/a>//g' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')

        echo "📦 [2/4] Computing binary checksums locally..."
        mkdir -p /tmp/proofcore_assets
        gh release download "$TAG" --repo "$REPO" --dir /tmp/proofcore_assets || true
        
        CHECKSUMS=$(cd /tmp/proofcore_assets && sha256sum * 2>/dev/null || echo "No binary assets uploaded")
        rm -rf /tmp/proofcore_assets
        
        MANIFEST="Repository: $REPO
        Release Tag: $TAG
        Target Commit: $COMMIT_SHA

        Artifact SHA-256 Checksums:
        $CHECKSUMS

        Release Notes:
        $CLEAN_BODY"
        
        echo "🔑 [3/4] Requesting GitHub OIDC Token..."
        OIDC_TOKEN=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          OIDC_RESPONSE=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api.proofcore.org")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
        fi

        PAYLOAD=$(jq -n \
          --arg content "$MANIFEST" \
          --arg agent "github-release-notary" \
          --arg title "Release $TAG ($REPO)" \
          --arg oidc "$OIDC_TOKEN" \
          '{content: $content, agent_id: $agent, title: $title, github_oidc_token: $oidc}')
        
        echo "🚀 [4/4] Anchoring Release to ProofCore Protocol..."
        RESPONSE=$(curl -s -X POST https://api.proofcore.org/api/v0.1/seal \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD")
        
        # Берем HTML-бейдж с target="_blank" (с фоллбэком на markdown)
        BADGE=$(echo "$RESPONSE" | jq -r '.badge_html // .badge_markdown // empty')
        
        if [ -z "$BADGE" ]; then
          echo "❌ Failed to seal release. Server response: $RESPONSE"
          exit 1
        fi
        
        NEW_BODY="$CLEAN_BODY

        ---
        $BADGE"
        
        gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
        echo "🎉 Success! Release permanently anchored on TON Blockchain."
